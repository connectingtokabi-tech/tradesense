name: Java CI - Build and Security Scan

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ci-build:
    name: Build, Test and Security
    runs-on:  self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure Java from repository
      # Keep the Java version in .java-version
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 3. Build, execute JUnit tests, and analyze with SonarQube
      - name: Build, test and analyze
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn.cmd -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar `
            "-Dsonar.projectKey=sonarqube-github" `
            "-Dsonar.projectName=sonarqube-github" `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN"

      # 4. JFrog CLI setup
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # 5. JFrog Xray dependency audit
      - name: JFrog Xray Audit
        shell: powershell
        continue-on-error: false
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          $jfPath = (Get-Command jf.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $jfPath) {
            $jfPath = (Get-Command jf -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $jfPath) {
            $candidatePaths = @(
              "${env:ProgramFiles}\JFrog\jf.exe",
              "${env:ProgramFiles(x86)}\JFrog\jf.exe",
              "$env:USERPROFILE\.jfrog\jf.exe"
            )
            $jfPath = $candidatePaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }

          if (-not $jfPath) {
            throw "JFrog CLI not found on PATH or in standard install locations."
          }

          Write-Host "Using JFrog CLI: $jfPath"

          & $jfPath audit *> reports/xray-audit.txt
          $auditExitCode = $LASTEXITCODE

          Write-Host "JFrog audit exit code: $auditExitCode"

          if ($auditExitCode -ne 0) {
            Write-Host "JFrog audit failed. Check reports/xray-audit.txt"
            Get-Content reports/xray-audit.txt
            exit $auditExitCode
          }

          Write-Host "JFrog Xray audit completed successfully."

      # 7. Veracode static security scan
      - name: Veracode Upload and Scan
        uses: veracode/veracode-uploadandscan-action@0.2.8
        with:
          appname: ${{ vars.VERACODE_APP_NAME }}
          createprofile: false
          filepath: target/*.jar
          version: ${{ github.sha }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          scantimeout: 30

      # 8. Save reports even if a previous step fails
      - name: Archive build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            reports/
          if-no-files-found: warn
          retention-days: 90

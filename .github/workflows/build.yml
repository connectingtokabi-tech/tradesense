
name: Tradesense - Maven Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Clean Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Maven Clean Install
        run: mvn clean install -B

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-artifacts
          path: |
            **/target/*.jar
          retention-days: 7

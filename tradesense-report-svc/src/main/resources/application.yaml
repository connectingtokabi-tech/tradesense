server:
  port: ${SERVER_PORT:5054}

spring:
  application:
    name: tradesense-report-svc
  datasource:
    url: ${TRADESENSE_DATABASE_URL:jdbc:postgresql://localhost:5432/tradesense}
    username: ${TRADESENSE_DATABASE_USERNAME:tradesense}
    password: ${TRADESENSE_DATABASE_PASSWORD:thekabi#123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  transaction:
    default-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

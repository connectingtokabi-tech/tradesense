<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TradeSense architecture diagram">
  <defs>
    <style>
      .title { font: bold 26px Arial, sans-serif; fill: #0f172a; }
      .label { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .box { fill: #e0f2fe; stroke: #0ea5e9; stroke-width: 2; rx: 12; }
      .box2 { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 12; }
      .box3 { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 12; }
      .box4 { fill: #f3e8ff; stroke: #a855f7; stroke-width: 2; rx: 12; }
      .box5 { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 12; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <text x="520" y="48" text-anchor="middle" class="title">TradeSense Architecture</text>

  <!-- Client -->
  <rect x="60" y="110" width="160" height="90" class="box"/>
  <text x="140" y="150" text-anchor="middle" class="label">Client / UI</text>
  <text x="140" y="170" text-anchor="middle" class="small">User interaction</text>

  <!-- API Gateway -->
  <rect x="290" y="110" width="180" height="90" class="box2"/>
  <text x="380" y="150" text-anchor="middle" class="label">API Gateway</text>
  <text x="380" y="170" text-anchor="middle" class="small">HTTP routing</text>

  <!-- Ingestion -->
  <rect x="540" y="110" width="180" height="90" class="box3"/>
  <text x="630" y="150" text-anchor="middle" class="label">Ingestion Service</text>
  <text x="630" y="170" text-anchor="middle" class="small">File upload + batch</text>

  <!-- Kafka -->
  <rect x="790" y="110" width="160" height="90" class="box4"/>
  <text x="870" y="150" text-anchor="middle" class="label">Kafka</text>
  <text x="870" y="170" text-anchor="middle" class="small">Event broker</text>

  <!-- Trade Processor -->
  <rect x="350" y="320" width="220" height="100" class="box2"/>
  <text x="460" y="365" text-anchor="middle" class="label">Trade Processor</text>
  <text x="460" y="385" text-anchor="middle" class="small">Consumes Kafka events</text>

  <!-- Validator -->
  <rect x="660" y="320" width="200" height="100" class="box5"/>
  <text x="760" y="365" text-anchor="middle" class="label">Validator Service</text>
  <text x="760" y="385" text-anchor="middle" class="small">Drools / KIE validation</text>

  <!-- Report -->
  <rect x="420" y="500" width="200" height="90" class="box3"/>
  <text x="520" y="545" text-anchor="middle" class="label">Report Service</text>
  <text x="520" y="565" text-anchor="middle" class="small">Queries / analytics</text>

  <!-- Database -->
  <rect x="760" y="500" width="190" height="90" class="box"/>
  <text x="855" y="545" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="855" y="565" text-anchor="middle" class="small">Trade + batch data</text>

  <!-- Arrows -->
  <path d="M 220 155 L 290 155" class="arrow"/>
  <path d="M 470 155 L 540 155" class="arrow"/>
  <path d="M 720 155 L 790 155" class="arrow"/>

  <path d="M 630 200 L 630 245 L 460 245 L 460 320" class="arrow"/>
  <path d="M 760 200 L 760 245 L 760 320" class="arrow"/>

  <path d="M 570 420 L 570 480 L 520 500" class="arrow"/>
  <path d="M 760 420 L 760 500" class="arrow"/>

  <path d="M 610 420 L 760 420" class="arrow"/>
  <path d="M 690 500 L 760 500" class="arrow"/>

  <text x="70" y="650" class="small">Flow: Upload → Publish Events → Validate → Persist → Report</text>
</svg>


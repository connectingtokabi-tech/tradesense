server:
  port: ${SERVER_PORT:5053}

spring:
  application:
    name: tradesense-validator-svc

management:
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

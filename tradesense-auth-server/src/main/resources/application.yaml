server:
  port: ${SERVER_PORT:5055}

spring:
  application:
    name: tradesense-auth-server

  datasource:
    url: ${TRADESENSE_DATABASE_URL:jdbc:postgresql://localhost:5432/tradesense}
    username: ${TRADESENSE_DATABASE_USERNAME:tradesense}
    password: ${TRADESENSE_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

tradesense:
  auth:
    username: ${TRADESENSE_AUTH_USERNAME:tradesense}
    password: ${TRADESENSE_AUTH_PASSWORD}
    issuer: ${TRADESENSE_AUTH_ISSUER:http://localhost:5055}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:5050}

spring:
  application:
    name: tradesense-api-gateway
  cloud:
    loadbalancer:
      configurations: round-robin
    discovery:
      client:
        simple:
          instances:
            # Add one URI per running replica; Spring Cloud LoadBalancer rotates across the list.
            tradesense-trade-processor:
              - uri: ${TRADESENSE_TRADE_PROCESSOR_URI:http://localhost:5052}
            tradesense-ingestion-svc:
              - uri: ${TRADESENSE_INGESTION_URI:http://localhost:5051}
            tradesense-validator-svc:
              - uri: ${TRADESENSE_VALIDATOR_URI:http://localhost:5053}
            tradesense-report-svc:
              - uri: ${TRADESENSE_REPORT_URI:http://localhost:5054}
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${TRADESENSE_CORS_ORIGIN_PATTERN:http://localhost:[*]}
                  - http://127.0.0.1:[*]
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: '*'
                exposed-headers:
                  - Location
                allow-credentials: false
          routes:
            - id: tradesense-trade-processor-stream
              uri: ${TRADESENSE_TRADE_PROCESSOR_URI:http://localhost:5052}
              predicates:
                - Path=/api/v1/trades/stream
            - id: tradesense-ingestion-service
              uri: ${TRADESENSE_INGESTION_URI:http://localhost:5051}
              predicates:
                - Path=/api/v1/trades/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
            - id: tradesense-validator-service
              uri: ${TRADESENSE_VALIDATOR_URI:http://localhost:5053}
              predicates:
                - Path=/api/v1/validation/**
            - id: tradesense-report-service
              uri: ${TRADESENSE_REPORT_URI:http://localhost:5054}
              predicates:
                - Path=/api/reports/**

management:
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
